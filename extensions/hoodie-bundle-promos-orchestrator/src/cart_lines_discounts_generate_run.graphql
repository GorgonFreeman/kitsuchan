query CartInput($collectionIds: [ID!]) {
  cart {
    lines {
      id
      quantity
      excludeAttribute: attribute(key: "_hoodie_bundle_exclude") {
        value
      }
      cost {
        amountPerQuantity {
          amount
          currencyCode
        }
      }
      merchandise {
        __typename
        ... on ProductVariant {
          id
          product {
            id
            collectionMemberships: inCollections(ids: $collectionIds) {
              collectionId
              isMember
            }
          }
        }
      }
    }
    cost {
      subtotalAmount {
        amount
        currencyCode
      }
    }
  }
  presentmentCurrencyRate
  discount {
    discountClasses
    metafield(namespace: "$app", key: "function-configuration") {
      jsonValue
    }
  }
}
