query CartInput(
  $hoodieCollectionIds: [ID!]
  $sweatpantsCollectionIds: [ID!]
) {
  cart {
    lines {
      id
      quantity
      excludeAttribute: attribute(key: "_hoodie_bundle_exclude") {
        value
      }
      cost {
        amountPerQuantity {
          amount
          currencyCode
        }
        subtotalAmount {
          amount
        }
      }
      merchandise {
        __typename
        ... on ProductVariant {
          id
          product {
            id
            inHoodieCollection: inAnyCollection(ids: $hoodieCollectionIds)
            inSweatpantsCollection: inAnyCollection(ids: $sweatpantsCollectionIds)
          }
        }
      }
    }
    cost {
      subtotalAmount {
        amount
        currencyCode
      }
    }
  }

  localization {
    country {
      isoCode
    }
    market {
      id
      handle
    }
  }
  presentmentCurrencyRate
  discount {
    discountClasses
    metafield(namespace: "$app", key: "function-configuration") {
      jsonValue
    }
  }
}
